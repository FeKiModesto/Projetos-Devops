version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-cp2
    environment:
      MYSQL_ROOT_PASSWORD: senha123
      MYSQL_DATABASE: cp2db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - cp2-network
    restart: unless-stopped

  api:
    build: .
    container_name: cp2-api
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cp2db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: senha123
    networks:
      - cp2-network
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  cp2-network:
    driver: bridge
